name: Offline tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      TIKTOKEN_CACHE_DIR: ${{ github.workspace }}/.local/tokenizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-build-lock.txt
            requirements-dev.txt
      - name: Prepare CI environment
        run: python -m pip install -r requirements-dev.txt -r requirements-build-lock.txt
      - name: Validate dependency locks without changes
        run: python -B scripts/lock_dependencies.py --check
      - name: Check Python
        run: python -m ruff check src scripts tests
      - name: Fetch verified public tokenizer data before offline tests
        shell: pwsh
        run: |
          @'
          import hashlib
          from pathlib import Path
          import urllib.request
          from scripts.build_windows import TOKENIZER_URL, TOKENIZER_NAME, TOKENIZER_SHA256
          data = urllib.request.urlopen(TOKENIZER_URL, timeout=60).read()
          if hashlib.sha256(data).hexdigest() != TOKENIZER_SHA256:
              raise RuntimeError('Public tokenizer checksum mismatch')
          cache = Path('.local/tokenizer')
          cache.mkdir(parents=True, exist_ok=True)
          (cache / TOKENIZER_NAME).write_bytes(data)
          '@ | python -B -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run offline tests
        run: python -B -m pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript modules
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath web/js -Filter '*.js' -Recurse | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Prepare CI browser
        run: python -m playwright install chromium
      - name: Run offline browser fixture smoke
        run: python -B scripts/browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: offline-browser-diagnostics-python-${{ matrix.python }}
          path: output/playwright/smoke/
